[package]
name = "flashcards"
version = "0.1.12"
description = "Flashcards — desktop study app with a hotkey overlay"
authors = ["gaggi32"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "flashcards_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# One connection owned by Rust, shared by both windows, with real transactions.
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
# OS credential store: DPAPI-backed Credential Manager on Windows, Keychain on macOS.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Reads the login item, to tell "turned off in Task Manager" from "deleted".
windows-registry = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

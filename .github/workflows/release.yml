name: Release

# Push a tag vX.Y.Z (matching package.json and tauri.conf.json) to build the
# Windows and macOS installers, attach them and their SHA-256 sums to a GitHub
# release, then publish it. The app's update check reads that release.
#
# Hardening: actions are pinned to commit SHAs; no job that runs npm or cargo
# (third-party code) holds a write token or a persisted git credential, and no
# release job uses a dependency cache; the release is written by jobs that run
# no project code; publishing runs in the protected "release" environment;
# tests run before anything is built; no event data is pasted into a script.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Tag must match the app version
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "v$PKG" ] || [ "$PKG" != "$CONF" ] || [ "$PKG" != "$CARGO" ]; then
            echo "tag $TAG, package.json $PKG, tauri.conf.json $CONF, Cargo.toml $CARGO must agree"; exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Rust tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
          mkdir -p dist && echo '<!doctype html>' > dist/index.html
          cargo test --manifest-path src-tauri/Cargo.toml --locked

  create-release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" --repo "$REPO" --draft --title "Flashcards $TAG" --generate-notes

  build:
    needs: [check, create-release]
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: x64-setup
          - os: macos-latest
            target: aarch64-apple-darwin
            label: arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Windows runners default to PowerShell, where "$TARGET" is an empty string.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - run: npm ci
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: npx tauri build --target "$TARGET" --ci
      - name: Rename and hash
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          OUT="src-tauri/target/$TARGET/release/bundle"
          if [ "$RUNNER_OS" = "Windows" ]; then
            SRC=$(ls "$OUT"/nsis/*.exe | head -1); EXT=exe
          else
            SRC=$(ls "$OUT"/dmg/*.dmg | head -1); EXT=dmg
          fi
          mkdir upload
          NAME="Flashcards-$VERSION-$LABEL.$EXT"
          cp "$SRC" "upload/$NAME"
          cd upload
          if command -v sha256sum >/dev/null; then sha256sum "$NAME" | cut -d' ' -f1 > "$NAME.sha256"
          else shasum -a 256 "$NAME" | cut -d' ' -f1 > "$NAME.sha256"; fi
          cat "$NAME.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-${{ matrix.label }}
          path: upload/
          if-no-files-found: error
          retention-days: 3

  upload:
    # Runs no project code: takes the built files and attaches them.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installer-*
          path: upload
          merge-multiple: true
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" upload/* --repo "$REPO" --clobber

  publish:
    needs: [check, upload]
    runs-on: ubuntu-latest
    # The protected environment only admits v* tags.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false
